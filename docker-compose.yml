version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: shibutzim_postgres
    restart: always

    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis-cache:
    image: redis:7-alpine
    container_name: shibutzim_redis
    restart: always
    ports:
      - '6379:6379'

volumes:
  postgres_data:
